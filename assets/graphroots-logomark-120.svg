    <line x1="64" y1="42" x2="64" y2="86"/>
    <line x1="64" y1="86" x2="25.895" y2="108"/>
    <line x1="64" y1="86" x2="102.105" y2="108"/>
  </g>
  <g fill="#fff" stroke="#000" stroke-width="4">
    <circle cx="25.895" cy="20" r="9"/>
    <circle cx="102.105" cy="20" r="9"/>
    <circle cx="64" cy="42" r="9"/>
    <circle cx="64" cy="86" r="9"/>
    <circle cx="25.895" cy="108" r="9"/>
    <circle cx="102.105" cy="108" r="9"/>
