<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">GraphRoots</title>
  <desc id="desc">Logomark: a tree with roots drawn as a graph of six nodes and five edges.</desc>
  <g fill="none" stroke="#000" stroke-width="4" stroke-linecap="butt">
    <line x1="22" y1="20" x2="64" y2="46"/>
    <line x1="106" y1="20" x2="64" y2="46"/>
    <line x1="64" y1="46" x2="64" y2="86"/>
    <line x1="64" y1="86" x2="34" y2="114"/>
    <line x1="64" y1="86" x2="94" y2="114"/>
  </g>
  <g fill="#fff" stroke="#000" stroke-width="4">
    <circle cx="22" cy="20" r="9"/>
    <circle cx="106" cy="20" r="9"/>
    <circle cx="64" cy="46" r="9"/>
    <circle cx="64" cy="86" r="9"/>
    <circle cx="34" cy="114" r="9"/>
    <circle cx="94" cy="114" r="9"/>
  </g>
</svg>
