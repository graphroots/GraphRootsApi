<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="title desc">
  <title id="title">Solver walk</title>
  <desc id="desc">A solver walks Document to Node to Port to EDGE to Port to Node. A floating parameter is a Node with Kind Parameter and one synthetic Port whose PortId equals the NodeId.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M1,1 L15,8 L1,15 Z" fill="#0F6E56"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <text x="80" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0F6E56">COMPUTATIONAL GRAPH</text>
  <text x="80" y="132" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#141414">Solver walk</text>
  <text x="80" y="178" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4A453F">Document &#8594; Node &#8594; Port &#8594; EDGE &#8594; Port &#8594; Node</text>

  <rect x="64" y="220" width="1160" height="780" rx="18" fill="#FFFFFF" stroke="#141414" stroke-width="2"/>
  <text x="104" y="278" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#141414">Document</text>
  <text x="292" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4A453F">CONTAINS both nodes</text>

  <rect x="112" y="360" width="360" height="500" rx="14" fill="#F6F4F1" stroke="#141414" stroke-width="2"/>
  <text x="148" y="424" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#141414">Node</text>
  <text x="148" y="460" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4A453F">Kind = Operator</text>
  <text x="148" y="530" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0F6E56">HAS_PORT</text>

  <rect x="820" y="360" width="360" height="500" rx="14" fill="#F6F4F1" stroke="#141414" stroke-width="2"/>
  <text x="960" y="424" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#141414">Node</text>
  <text x="960" y="460" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4A453F">Kind = Operator</text>
  <text x="960" y="530" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0F6E56">HAS_PORT</text>

  <rect x="372" y="574" width="200" height="112" rx="12" fill="#FFFFFF" stroke="#141414" stroke-width="2"/>
  <text x="472" y="622" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#141414">Port</text>
  <text x="472" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4A453F">Direction = Out</text>

  <rect x="720" y="574" width="200" height="112" rx="12" fill="#FFFFFF" stroke="#141414" stroke-width="2"/>
  <text x="820" y="622" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#141414">Port</text>
  <text x="820" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4A453F">Direction = In</text>

  <line x1="572" y1="630" x2="720" y2="630" stroke="#0F6E56" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="638" y="612" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0F6E56">EDGE</text>

  <text x="104" y="940" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4A453F">Containment is CONTAINS and HAS_PORT. The solver follows EDGE from source to target.</text>

  <rect x="1264" y="220" width="576" height="780" rx="18" fill="#E6F3EE"/>
  <text x="1308" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#0F6E56">SYNTHETIC PORT</text>
  <text x="1308" y="348" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#141414">Floating parameter</text>

  <text x="1308" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#141414">Still a Node.</text>
  <text x="1308" y="456" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#141414">Kind = Parameter</text>
  <text x="1308" y="516" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#141414">One synthetic Port.</text>
  <text x="1308" y="552" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#141414">PortId = NodeId</text>
  <text x="1308" y="612" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#141414">Direction follows the wires:</text>
  <text x="1308" y="648" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#141414">In, Out, or Both.</text>
  <text x="1308" y="708" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1E4D40">Declared ports stay In or Out.</text>

  <rect x="1348" y="760" width="400" height="180" rx="12" fill="#FFFFFF" stroke="#141414" stroke-width="2"/>
  <text x="1376" y="808" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#141414">Node</text>
  <text x="1376" y="834" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4A453F">Kind = Parameter</text>
  <rect x="1548" y="792" width="168" height="72" rx="10" fill="#F6F4F1" stroke="#141414" stroke-width="2"/>
  <text x="1632" y="824" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141414">Port</text>
  <text x="1632" y="846" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4A453F">PortId = NodeId</text>
</svg>
